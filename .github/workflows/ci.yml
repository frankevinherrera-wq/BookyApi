name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Bookfy.slnx

      - name: Build
        run: dotnet build Bookfy.slnx --no-restore

      - name: Test
        run: dotnet test MiBook.Tests/MiBook.Tests.csproj --no-build --no-restore